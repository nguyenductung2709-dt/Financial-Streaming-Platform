syntax = "proto3";

package market.v1;

option go_package = "financial-streaming-platform/gen/go/market/v1;marketv1";

import "google/protobuf/timestamp.proto";

message PriceEvent {
    string symbol = 1;
    SecurityType security_type = 2;
    uint64 last_price_micros = 3; // Positive CSV price × 1,000,000; parse decimal text exactly
    google.protobuf.Timestamp trade_time = 4;
    uint64 source_row = 5;  // Will be used for replay/debugging and fault-tolerant tests
}

enum SecurityType {
    SECURITY_TYPE_UNSPECIFIED = 0;
    SECURITY_TYPE_EQUITY = 1;
    SECURITY_TYPE_INDEX = 2;
}