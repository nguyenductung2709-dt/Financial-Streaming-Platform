syntax = "proto3";

package market.v1;

option go_package = "financial-streaming-platform/gen/market/v1;marketv1";

import "google/protobuf/timestamp.proto";

message PriceEvent {
    string event_id = 1;
    string symbol = 2;
    SecurityType security_type = 3;
    uint64 last_price_micros = 4; // Positive CSV price × 1,000,000; parse decimal text exactly
    google.protobuf.Timestamp trade_time = 5;
    uint64 source_row = 6;  // Will be used for replay/debugging and fault-tolerant tests
}

enum SecurityType {
    SECURITY_TYPE_UNSPECIFIED = 0;
    SECURITY_TYPE_EQUITY = 1;
    SECURITY_TYPE_INDEX = 2;
}