name: Streaming processor CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check Scala formatting and compiler lint
        run: make lint-streaming-processor
      - name: Test and assemble deployment JAR
        working-directory: services/streaming-processor
        run: sbt test verifyAssembly
