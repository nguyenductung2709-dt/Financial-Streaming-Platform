name: Streaming processor CI

on:
  push:
    paths:
      - 'services/streaming-processor/**'
      - '!services/streaming-processor/**/*.md'
      - 'gen/java/**'
      - 'schemas/**/*.proto'
      - 'Makefile'
      - 'scripts/submit-flink-job.py'
      - 'scripts/tests/**'
      - '.github/workflows/streaming-processor-ci.yml'
  pull_request:
    paths:
      - 'services/streaming-processor/**'
      - '!services/streaming-processor/**/*.md'
      - 'gen/java/**'
      - 'schemas/**/*.proto'
      - 'Makefile'
      - 'scripts/submit-flink-job.py'
      - 'scripts/tests/**'
      - '.github/workflows/streaming-processor-ci.yml'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test Flink submission and restore commands
        run: make test-flink-scripts
      - name: Check Scala formatting and compiler lint
        run: make lint-streaming-processor
      - name: Test and assemble deployment JAR
        working-directory: services/streaming-processor
        run: sbt test verifyAssembly
