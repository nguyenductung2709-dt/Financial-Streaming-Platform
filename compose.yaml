name: financial-streaming-platform
volumes:
  redpanda-0:
  flink-state:
  postgres-data:
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_streaming}
      POSTGRES_USER: ${POSTGRES_USER:-financial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_dev}
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Reads ema-windows and trade-advisories into PostgreSQL. Pass -init-db or
  # -reset-db as the command to run a one-off schema task instead.
  materializer:
    build:
      context: .
      dockerfile: services/materializer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-0:
        condition: service_healthy
    environment:
      MATERIALIZER_DATABASE_URL: postgresql://${POSTGRES_USER:-financial}:${POSTGRES_PASSWORD:-financial_dev}@postgres:5432/${POSTGRES_DB:-financial_streaming}?sslmode=disable
      MATERIALIZER_BROKERS: redpanda-0:9092
      MATERIALIZER_GROUP_ID: ${MATERIALIZER_GROUP_ID:-materializer}
      MATERIALIZER_STAMP_TOPIC: ${MATERIALIZER_STAMP_TOPIC:-}
    restart: "no"

  # Publishes CSV events. The profile keeps a plain `docker compose up` from
  # starting it; run it with `make run-data-producer` or `docker compose run`.
  data-producer:
    build:
      context: .
      dockerfile: services/data-producer/Dockerfile
    profiles: ["producer"]
    depends_on:
      redpanda-0:
        condition: service_healthy
    entrypoint: ["/data-producer", "-brokers=redpanda-0:9092"]
    restart: "no"

  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  create-topic:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda-0:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        #skip topic if it already exists, so re-running is safe 
        rpk topic describe trade-events -X brokers=redpanda-0:9092 >/dev/null 2>&1 ||
          rpk topic create trade-events --partitions 1 --replicas 1 -X brokers=redpanda-0:9092
        rpk topic describe trade-events-dlq -X brokers=redpanda-0:9092 >/dev/null 2>&1 ||
          rpk topic create trade-events-dlq --partitions 1 --replicas 1 -X brokers=redpanda-0:9092
        rpk topic describe ema-windows -X brokers=redpanda-0:9092 >/dev/null 2>&1 ||
          rpk topic create ema-windows --partitions 1 --replicas 1 -c message.timestamp.type=LogAppendTime -X brokers=redpanda-0:9092
        rpk topic describe trade-advisories -X brokers=redpanda-0:9092 >/dev/null 2>&1 ||
          rpk topic create trade-advisories --partitions 1 --replicas 1 -c message.timestamp.type=LogAppendTime -X brokers=redpanda-0:9092
        rpk topic describe latency-stamps -X brokers=redpanda-0:9092 >/dev/null 2>&1 ||
          rpk topic create latency-stamps --partitions 1 --replicas 1 -X brokers=redpanda-0:9092
        rpk topic describe materialize-stamps -X brokers=redpanda-0:9092 >/dev/null 2>&1 ||
          rpk topic create materialize-stamps --partitions 1 --replicas 1 -X brokers=redpanda-0:9092

  console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    entrypoint: ["/bin/sh", "-ec"]
    command: 
      - 'printf "%s" "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; exec /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
        serde:
          protobuf:
            enabled: true
            mappings:
              - topicName: trade-events
                valueProtoType: market.v1.PriceEvent
              - topicName: trade-events-dlq
                valueProtoType: market.v1.RejectedRow
              - topicName: trade-advisories
                valueProtoType: market.v1.TradeAdvisory
              - topicName: ema-windows
                valueProtoType: market.v1.EmaWindow
            fileSystem:
              enabled: true
              paths: ["/etc/protos"]
    volumes:
      - ./schemas:/etc/protos:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda-0:
        condition: service_healthy
    restart: unless-stopped

  flink-state-init:
    image: flink:2.2.1-java17
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /opt/flink/state/checkpoints /opt/flink/state/savepoints
        chown -R flink:flink /opt/flink/state
    volumes:
      - flink-state:/opt/flink/state
    restart: "no"

  jobmanager:
    image: flink:2.2.1-java17
    ports:
      - "127.0.0.1:8081:8081"
    command: jobmanager
    depends_on:
      flink-state-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.profiling.enabled: true
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        parallelism.default: 1
        execution.checkpointing.interval: 30 s
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/state/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/state/savepoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-state:/opt/flink/state
    restart: unless-stopped

  taskmanager:
    image: flink:2.2.1-java17
    depends_on:
      jobmanager:
        condition: service_started
      flink-state-init:
        condition: service_completed_successfully
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.profiling.enabled: true
        taskmanager.numberOfTaskSlots: 2
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/state/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/state/savepoints
    volumes:
      - flink-state:/opt/flink/state
    restart: unless-stopped
